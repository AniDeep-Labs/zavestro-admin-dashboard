# ============================================================================
# Zavestro Admin — outer nginx server blocks (drop-in for the shared droplet)
#
# SERVER BLOCKS ONLY — live in the same nginx http{} as the api + web blocks.
# Install: /etc/nginx/conf.d/zavestro-admin.conf  (needs `include
# /etc/nginx/conf.d/*.conf;` in the main nginx.conf http{}).
#
#   PRODUCTION droplet → server_name admin.zavestro.in        (as shipped)
#   STAGING droplet    → server_name admin-staging.zavestro.in + matching cert
#
# TLS:  sudo certbot --nginx -d admin.zavestro.in
#       (staging:  sudo certbot --nginx -d admin-staging.zavestro.in)
# ============================================================================

upstream admin_app { server 127.0.0.1:3002; }

server {
  listen 80;
  server_name admin.zavestro.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name admin.zavestro.in;

  ssl_certificate     /etc/letsencrypt/live/admin.zavestro.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.zavestro.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;            # admin must never be framed
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    proxy_pass http://admin_app;
  }
}
