# In-container nginx — serves the built SPA. The OUTER droplet nginx
# (nginx/zavestro-admin.conf) terminates TLS and proxies admin.zavestro.in here.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets are immutable — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: every other path falls back to index.html (react-router handles routing).
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;
}
