# ============================================================================
# Zavestro Admin Dashboard — CD (build env-baked image → GHCR → SSH deploy)
#
# Flow:  develop → staging   (auto on push to develop)
#        main    → production (auto on push to main)
#
# VITE_* are baked at build, so the image is environment-specific — we build
# INSIDE each environment job with that environment's values. GitHub
# Environments scope the vars/secrets below.
#
# Required GitHub *Variables* (Settings → Environments → staging/production):
#   VITE_API_URL              e.g. https://api.zavestro.in
#   VITE_ENV                  staging | production
#   VITE_SENTRY_DSN           (optional) browser DSN
#   VITE_DD_APPLICATION_ID    (optional) Datadog RUM
#   VITE_DD_CLIENT_TOKEN      (optional) Datadog RUM
#   VITE_DD_SITE              (optional) e.g. us5.datadoghq.com
#   VITE_CONFIGCAT_SDK_KEY    (optional) ConfigCat
#
# Required GitHub *Secrets*:
#   SSH_PRIVATE_KEY, STAGING_SSH_HOST/USER, PRODUCTION_SSH_HOST/USER
#   (same droplet values as the backend repo)
#
# Activate by setting repo variable ADMIN_DEPLOY_ENABLED=true (after the
# droplet's outer nginx + DNS for admin.zavestro.in are in place).
# ============================================================================

name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anideep-labs/zavestro-admin-dashboard

jobs:
  # ── Staging ────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    if: vars.ADMIN_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (staging-baked)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_ENV=${{ vars.VITE_ENV }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_DD_APPLICATION_ID=${{ vars.VITE_DD_APPLICATION_ID }}
            VITE_DD_CLIENT_TOKEN=${{ vars.VITE_DD_CLIENT_TOKEN }}
            VITE_DD_SITE=${{ vars.VITE_DD_SITE }}
            VITE_CONFIGCAT_SDK_KEY=${{ vars.VITE_CONFIGCAT_SDK_KEY }}
            VITE_COMMIT_SHA=${{ github.sha }}
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace
      - name: Add staging host to known_hosts
        run: ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy compose file
        run: |
          scp docker-compose.production.yml \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/opt/zavestro-admin/docker-compose.production.yml
      - name: Deploy on staging
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh $USER@$HOST IMAGE="$IMAGE" GITHUB_TOKEN="$GITHUB_TOKEN" GITHUB_ACTOR="$GITHUB_ACTOR" bash -s << 'ENDSSH'
            set -euo pipefail
            mkdir -p /opt/zavestro-admin && cd /opt/zavestro-admin
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE"
            IMAGE="$IMAGE" docker compose -f docker-compose.production.yml up -d --force-recreate admin
            for i in $(seq 1 8); do
              sleep 4
              curl -sf http://localhost:3002/ >/dev/null && echo "✓ Admin healthy" && exit 0 || true
            done
            echo "✗ Health check failed" && docker logs zavestro-admin --tail 60 && exit 1
          ENDSSH

  # ── Production ───────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    if: vars.ADMIN_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (production-baked)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_ENV=${{ vars.VITE_ENV }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_DD_APPLICATION_ID=${{ vars.VITE_DD_APPLICATION_ID }}
            VITE_DD_CLIENT_TOKEN=${{ vars.VITE_DD_CLIENT_TOKEN }}
            VITE_DD_SITE=${{ vars.VITE_DD_SITE }}
            VITE_CONFIGCAT_SDK_KEY=${{ vars.VITE_CONFIGCAT_SDK_KEY }}
            VITE_COMMIT_SHA=${{ github.sha }}
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace
      - name: Add production host to known_hosts
        run: ssh-keyscan -H "${{ secrets.PRODUCTION_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy compose file
        run: |
          scp docker-compose.production.yml \
            ${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}:/opt/zavestro-admin/docker-compose.production.yml
      - name: Deploy on production
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh $USER@$HOST IMAGE="$IMAGE" GITHUB_TOKEN="$GITHUB_TOKEN" GITHUB_ACTOR="$GITHUB_ACTOR" bash -s << 'ENDSSH'
            set -euo pipefail
            mkdir -p /opt/zavestro-admin && cd /opt/zavestro-admin
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE"
            IMAGE="$IMAGE" docker compose -f docker-compose.production.yml up -d --force-recreate admin
            for i in $(seq 1 8); do
              sleep 4
              curl -sf http://localhost:3002/ >/dev/null && echo "✓ Admin healthy — ${{ github.sha }}" && exit 0 || true
            done
            echo "✗ Health check failed" && docker logs zavestro-admin --tail 60 && exit 1
          ENDSSH
